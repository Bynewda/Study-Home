name: Build Android APK (NONGYEOL)

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare www bundle and install Capacitor
        run: |
          npm run prepare-www
          npm install --no-audit --no-fund

      - name: Generate Capacitor Android project
        run: |
          rm -rf android
          npx cap add android
          python3 - <<'PY'
          import os, glob, shutil
          from pathlib import Path

          # 1) AndroidManifest.xml 보강 (클리어텍스트/앱이름/인텐트 확인)
          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          txt = manifest_path.read_text(encoding='utf-8')
          if 'android:usesCleartextTraffic' not in txt:
              txt = txt.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          manifest_path.write_text(txt, encoding='utf-8')

          # 2) strings.xml 앱 이름을 '논결' 로 깔끔하게 지정
          strings_path = Path('android/app/src/main/res/values/strings.xml')
          if strings_path.exists():
              stxt = strings_path.read_text(encoding='utf-8')
              stxt = stxt.replace('논결 NONGYEOL', '논결')
              strings_path.write_text(stxt, encoding='utf-8')

          # 3) 기본 Capacitor 아이콘을 논결(NONGYEOL) 아이콘으로 교체
          icon_any = Path('assets/icon-512.png')
          icon_mask = Path('assets/icon-maskable-512.png')
          res_dir = Path('android/app/src/main/res')
          for d in res_dir.glob('mipmap-*'):
              if not d.is_dir():
                  continue
              for name in ['ic_launcher.png', 'ic_launcher_round.png']:
                  target = d / name
                  if target.exists() and icon_any.exists():
                      shutil.copy2(icon_any, target)
              fg = d / 'ic_launcher_foreground.png'
              if fg.exists() and icon_mask.exists():
                  shutil.copy2(icon_mask, fg)

          # Adaptive icon 배경색을 잉크 그린(#244C3D)으로 통일
          colors_xml = res_dir / 'values' / 'ic_launcher_background.xml'
          if colors_xml.exists():
              colors_xml.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#244C3D</color>\n</resources>\n',
                  encoding='utf-8'
              )
          PY
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk NONGYEOL-Android.apk
          ls -lh NONGYEOL-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NONGYEOL-Android-APK
          path: NONGYEOL-Android.apk
          retention-days: 30

      - name: Publish APK to GitHub Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest NONGYEOL-Android.apk --clobber
          else
            gh release create latest NONGYEOL-Android.apk \
              --title "논결(NONGYEOL) Android 앱 최신 빌드" \
              --notes "갤럭시 S25 엣지 · 레노버 요가탭 플러스 13 Gen 2 최적화 Android APK (Capacitor + K-EXAONE 2.5 네이티브 브리지 내장)"
          fi
